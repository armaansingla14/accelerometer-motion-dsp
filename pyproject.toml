[project]
name = "motiondsp"
version = "0.1.0"
description = "DSP and motion classification for IMU and wheel-encoder data"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
